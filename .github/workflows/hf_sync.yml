name: Sync Backend to Hugging Face

on:
  push:
    branches: [ main ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push Subdirectory to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configure a temporary git identity for the push
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 2. Add the Hugging Face remote
          git remote add hf https://geemal204:$HF_TOKEN@huggingface.co/spaces/geemal204/driveease

          # 3. Isolate and push ONLY the backend directory
          # This extracts the history of 'driveease-backend' and pushes it as the root of HF's main branch
          git subtree push --prefix driveease-backend hf main
